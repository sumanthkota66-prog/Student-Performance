on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and Push to Docker Hub

    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: 4. Set Image Tag
        id: image_tag
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 5. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 6. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 7. Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/student:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/student:${{ steps.image_tag.outputs.image_tag }}

  deploy-to-argocd:
    runs-on: self-hosted
    name: Deploy to Argo CD
    needs: build-and-push

    permissions:
      contents: write

    env:
      KUBECONFIG: /home/docker/.kube/config

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Check Kubernetes Connection
        run: |
          echo "Runner user: $(whoami)"
          echo "Kubeconfig: ${KUBECONFIG}"

          test -f "${KUBECONFIG}" || {
            echo "ERROR: ${KUBECONFIG} does not exist"
            exit 1
          }

          kubectl config use-context kind-three-node-cluster
          kubectl cluster-info
          kubectl get nodes

      - name: 3. Apply Argo CD Application
        run: |
          kubectl apply -f argoCD/application.yaml

      - name: 4. Check Resources
        run: |
          kubectl get applications -n argocd
          kubectl get deployments
          kubectl get services
          kubectl get nodes -o wide
