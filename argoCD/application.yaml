apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app-es
  namespace: argocd
    
spec:
  project: default
  source:
    repoURL: https://github.com/sumanthkota66-prog/Student-Performance
    targetRevision: main
    path: k8s   
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
